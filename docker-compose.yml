      filesystem:
        condition: service_healthy
    environment:
      <<: *rustfs-env
    entrypoint: >
      /bin/sh -ec "rc alias set local http://filesystem:9000
      $${RUSTFS_ACCESS_KEY} $${RUSTFS_SECRET_KEY};
      rc mb local/chatbotx --ignore-existing;
      touch /tmp/empty;
      rc cp /tmp/empty local/chatbotx/public/;
      rc anonymous set public local/chatbotx/public;"

  mailhog:
    <<: *network
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    expose:
      - "1025"
      - "8025"

  adminer:
    <<: *network
    image: adminer:5.4.2
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  builder:
    <<:
      - *network
      - *depends-datastores
    image: ghcr.io/chatbotxio/chatbotx-builder:latest
    platform: linux/amd64
    restart: unless-stopped
    environment:
      <<: *common-env
    expose:
      - "3000"
    healthcheck:
      # Imagem builder nao tem curl. Node existe (Next.js) e consulta a rota real.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health', {signal:AbortSignal.timeout(8000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  javascript-executor:
    image: ghcr.io/chatbotxio/chatbotx-javascript-executor:latest
    platform: linux/amd64
    restart: unless-stopped
    networks:
      - javascript-executor-network
    environment:
      JAVASCRIPT_EXECUTOR_TOKEN: "${SERVICE_BASE64_64_JSEXEC}"
      MAX_CONCURRENCY: "2"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
          pids: 128
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3210/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    image: ghcr.io/chatbotxio/chatbotx-worker:latest
    platform: linux/amd64
    restart: unless-stopped
    networks:
      - main
      - javascript-executor-network
    environment:
      <<: *common-env
    command: ["worker", "all"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      filesystem:
        condition: service_healthy
      javascript-executor:
        condition: service_healthy

  realtime:
    <<: *network
    image: ghcr.io/chatbotxio/chatbotx-realtime:latest
    platform: linux/amd64
    restart: unless-stopped
    environment:
      <<: *common-env
    entrypoint: >
      bash -c "
        cd /app/apps/realtime;
        echo \"REALTIME_BROADCAST_SECRET=$${REALTIME_BROADCAST_SECRET}\" > .env;
        HOSTNAME=0.0.0.0 PORT=1999 pnpm dlx partykit dev;
      "
    expose:
      - "1999"

networks:
  main:
    driver: bridge
  javascript-executor-network:
    driver: bridge
    internal: true

volumes:
  db-data:
  redis-data:
